name: Deploy to AWS ECS

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: novapay-prod

jobs:
  # ---------------------------------------------------------------------------
  # TEST
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test ./... -race -timeout 60s

  # ---------------------------------------------------------------------------
  # BUILD & PUSH IMAGES
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    outputs:
      gateway-image:  ${{ steps.build.outputs.gateway-image }}
      frontend-image: ${{ steps.build.outputs.frontend-image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        id: build
        run: |
          GIT_SHA="${GITHUB_SHA::8}"

          # Gateway
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/novapay/gateway:$GIT_SHA \
            -t $ECR_REGISTRY/novapay/gateway:latest \
            ./backend
          docker push $ECR_REGISTRY/novapay/gateway:$GIT_SHA
          docker push $ECR_REGISTRY/novapay/gateway:latest
          echo "gateway-image=$ECR_REGISTRY/novapay/gateway:$GIT_SHA" >> $GITHUB_OUTPUT

          # Frontend
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=https://nova-pay.in \
            -t $ECR_REGISTRY/novapay/frontend:$GIT_SHA \
            -t $ECR_REGISTRY/novapay/frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/novapay/frontend:$GIT_SHA
          docker push $ECR_REGISTRY/novapay/frontend:latest
          echo "frontend-image=$ECR_REGISTRY/novapay/frontend:$GIT_SHA" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # DEPLOY GATEWAY
  # ---------------------------------------------------------------------------
  deploy-gateway:
    name: Deploy Gateway
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition novapay-gateway \
            --query taskDefinition \
            > task-def-gateway.json

      - name: Update image in task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render-gateway
        with:
          task-definition: task-def-gateway.json
          container-name:  gateway
          image:           ${{ needs.build.outputs.gateway-image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:          ${{ steps.render-gateway.outputs.task-definition }}
          service:                  novapay-gateway
          cluster:                  ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ---------------------------------------------------------------------------
  # DEPLOY FRONTEND
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition novapay-frontend \
            --query taskDefinition \
            > task-def-frontend.json

      - name: Update image in task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render-frontend
        with:
          task-definition: task-def-frontend.json
          container-name:  frontend
          image:           ${{ needs.build.outputs.frontend-image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:          ${{ steps.render-frontend.outputs.task-definition }}
          service:                  novapay-frontend
          cluster:                  ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
